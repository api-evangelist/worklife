name: WorkLife
description: 'Worklife (Heroik Labs, Inc. d/b/a Worklife) was a San Francisco meeting-productivity
  application that helped teams run highly effective meetings — agenda generation and tracking, meeting
  organization, calendaring, collaborative real-time notes, and clear action items — with a Slack integration
  and free and paid tiers. A 500 Global (500 Startups) portfolio company, it was acquired by Cisco on
  October 17, 2016 and folded into the Cisco Spark collaboration platform (worklife.com redirected to
  notes.ciscospark.com by early 2017). The standalone worklife.com domain no longer resolves and no public
  API surface was ever published; this profile is retained as a historical portfolio-lead record.'
